# Local Postgres for development and database tests. Production uses Neon.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fabric_doctor
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - fabric_doctor_pg:/var/lib/postgresql/data

volumes:
  fabric_doctor_pg:
